name: Extension checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run zip
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-review-package
          path: .output/*-chrome.zip
